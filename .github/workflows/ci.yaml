name: CI

on:
  pull_request:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

env:
  # Keep in sync with .mise.toml so CI and local runs use the same linter.
  GOLANGCI_LINT_VERSION: v2.13.1

jobs:
  test:
    name: Lint and test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      - name: Install go
        uses: actions/setup-go@v7.0.0
        with:
          go-version-file: go.mod
          cache: true

      - name: Install golangci-lint
        run: go install "github.com/golangci/golangci-lint/v2/cmd/golangci-lint@${GOLANGCI_LINT_VERSION}"

      - name: Lint
        run: golangci-lint run ./...

      - name: Check formatting
        run: |
          golangci-lint fmt --diff

      - name: Test
        run: go test -race ./...

      - name: Check go.mod is tidy
        run: |
          go mod tidy
          git diff --exit-code -- go.mod go.sum

  build:
    name: Build binaries
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1
        with:
          # goreleaser needs tag history to derive a snapshot version.
          fetch-depth: 0

      - name: Install go
        uses: actions/setup-go@v7.0.0
        with:
          go-version-file: go.mod
          cache: true

      - name: Check GoReleaser config
        uses: goreleaser/goreleaser-action@v7.2.3
        with:
          args: check

      - name: Build all release targets
        uses: goreleaser/goreleaser-action@v7.2.3
        with:
          args: release --snapshot --clean --skip=publish

      - name: Upload binaries
        uses: actions/upload-artifact@v7
        with:
          name: snapshot-binaries
          path: dist/*.tar.gz
          if-no-files-found: error
          retention-days: 7

  install-script:
    name: Lint install.sh
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      - name: ShellCheck
        run: shellcheck install.sh
